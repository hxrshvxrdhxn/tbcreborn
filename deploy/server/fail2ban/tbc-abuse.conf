# Requests Caddy refused (403 scraper/no user agent) or answered 404 to a vulnerability probe, plus 429s from the app.
[Definition]
failregex = "client_ip":"<HOST>".*"status":(403|429)
            "client_ip":"<HOST>".*"uri":"/(\.env|\.git|\.aws|wp-admin|wp-login\.php|xmlrpc\.php|phpmyadmin|vendor/phpunit|cgi-bin)
ignoreregex = "client_ip":"(127\.0\.0\.1|::1)"
datepattern = "ts":{EPOCH}
